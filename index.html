<title>مراجعة اختبار البترول 2026</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: a lab-notebook home grid of 12 section cards; a focused one-question-at-a-time quiz view; a result view with review of mistakes. */
:root{
  --bg:#f3f4f2; --surface:#ffffff; --ink:#16212b; --muted:#5b6770; --line:#d9ddd9;
  --accent:#b4540a; --accent-ink:#ffffff; --accent-soft:#f6e3d2;
  --good:#17703f; --good-soft:#dcefe3; --bad:#b3261e; --bad-soft:#f7dcd9;
  --font-display:'Reem Kufi','IBM Plex Sans Arabic',Tahoma,sans-serif;
  --font-body:'IBM Plex Sans Arabic',Tahoma,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12181d; --surface:#1b242b; --ink:#e8ecee; --muted:#9aa7b0; --line:#2f3b44;
  --accent:#e98b3f; --accent-ink:#1a1006; --accent-soft:#3a2a1b;
  --good:#5fc58a; --good-soft:#18362a; --bad:#f08a82; --bad-soft:#40201e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12181d; --surface:#1b242b; --ink:#e8ecee; --muted:#9aa7b0; --line:#2f3b44;
  --accent:#e98b3f; --accent-ink:#1a1006; --accent-soft:#3a2a1b;
  --good:#5fc58a; --good-soft:#18362a; --bad:#f08a82; --bad-soft:#40201e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.7;
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:860px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;line-height:1.35}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hdr{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;padding-bottom:16px;border-bottom:2px solid var(--ink)}
.hdr h1{font-size:clamp(1.6rem,5vw,2.3rem);font-weight:700}
.hdr p{margin:0;color:var(--muted);font-size:.92rem}
.total{min-width:0;text-align:left}
.total b{font-family:var(--font-display);font-size:2rem;color:var(--accent);font-variant-numeric:tabular-nums}
.total span{display:block;font-size:.82rem;color:var(--muted)}
.who{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0 4px}
.who label{font-weight:500}
.who input{flex:1 1 220px;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:inherit}
.grp{margin:26px 0 10px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.grp h2{font-size:1.15rem}
.grp span{color:var(--muted);font-size:.85rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{min-width:0;text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.card:hover{border-color:var(--accent)}
.card .no{font-family:var(--font-display);color:var(--accent);font-size:.85rem;letter-spacing:.04em}
.card h3{font-size:1.05rem}
.card p{margin:0;font-size:.82rem;color:var(--muted);line-height:1.55;flex:1}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.meta{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.done .bar i{background:var(--good)}
.reset{margin-top:28px;background:none;border:1px solid var(--line);border-radius:6px;padding:8px 14px;color:var(--muted);font-size:.85rem}
.reset.arm{border-color:var(--bad);color:var(--bad)}
/* quiz */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.toprow{display:flex;gap:12px;align-items:center;justify-content:space-between}
.toprow strong{font-family:var(--font-display);font-size:1.05rem}
.back{background:none;border:1px solid var(--line);border-radius:6px;padding:5px 12px;font-size:.88rem}
.dots{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.dot{width:26px;height:26px;border-radius:5px;border:1px solid var(--line);background:var(--surface);font-size:.72rem;padding:0;font-variant-numeric:tabular-nums;color:var(--muted)}
.dot.ok{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.dot.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.dot.cur{outline:2px solid var(--accent);outline-offset:1px;color:var(--ink)}
.q{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px 18px}
.qn{font-size:.82rem;color:var(--accent);font-family:var(--font-display);letter-spacing:.04em}
.qt{font-size:1.15rem;font-weight:500;margin:6px 0 16px;unicode-bidi:plaintext;text-align:start;line-height:1.8;overflow-wrap:anywhere}
.opts{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.opt{width:100%;display:flex;gap:12px;align-items:center;text-align:right;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px 14px;min-width:0}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .l{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);font-family:var(--font-display);font-size:.9rem;background:var(--surface)}
.opt .t{flex:1;min-width:0;unicode-bidi:plaintext;text-align:start;overflow-wrap:anywhere}
.opt:disabled{cursor:default}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.right .l{background:var(--good);color:var(--bg);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.wrong .l{background:var(--bad);color:var(--bg);border-color:var(--bad)}
.fb{margin-top:14px;border-radius:8px;padding:12px 14px;background:var(--accent-soft);font-size:.95rem}
.fb b{display:block;margin-bottom:2px}
.fb.g b{color:var(--good)} .fb.b b{color:var(--bad)}
.fb div{unicode-bidi:plaintext;text-align:start}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:16px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:10px 22px;font-weight:600}
.btn.alt{background:none;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
/* result */
.res{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:24px 20px;text-align:center}
.score{font-family:var(--font-display);font-size:3.2rem;color:var(--accent);line-height:1.2;font-variant-numeric:tabular-nums}
.res h2{font-size:1.3rem;margin-top:6px}
.res p{color:var(--muted);margin:8px auto 0;max-width:46ch}
.acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px}
.rv{margin-top:22px}
.rv h3{font-size:1.05rem;margin-bottom:10px}
.rvi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px;min-width:0}
.rvi .qt{font-size:1rem;margin:2px 0 8px}
.rvi p{margin:2px 0;font-size:.9rem;unicode-bidi:plaintext;text-align:start}
.rvi .y{color:var(--good)} .rvi .n{color:var(--bad)}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
</style>

<script>
const DATA = {"titles": [["تجميع البترول ١", "أسئلة الملف الأصلي من 1 إلى 25"], ["تجميع البترول ٢", "أسئلة الملف الأصلي من 26 إلى 50"], ["تجميع البترول ٣", "أسئلة الملف الأصلي من 51 إلى 75"], ["تجميع البترول ٤", "أسئلة الملف الأصلي من 76 إلى 100"], ["الحركة والتسارع", "السرعة والتسارع والسقوط الحر والرسوم البيانية"], ["القوى وقوانين نيوتن", "المحصلة والاحتكاك والوزن الظاهري والمستوى المائل"], ["الشغل والطاقة والدفع", "الشغل والقدرة والكفاءة والزخم والتصادمات"], ["الدوران والعزم والآلات", "السرعة الزاوية والقوة المركزية والعزم والفائدة الميكانيكية"], ["الجاذبية والحرارة والغازات", "قانون الجذب وكبلر والحرارة وقوانين الغازات والضغط"], ["الموجات والضوء والصوت", "الموجات والانعكاس والانكسار والعدسات والصوت"], ["الذرة والنواة", "النماذج الذرية والإشعاع والاضمحلال والفوتون"], ["الكهرباء والقياس والطاقة", "قانون أوم والدوائر والوحدات والبادئات والطاقة المتجددة"]], "qs": [{"q": "سيارة كتلتها 1000 kg وسرعتها 30 m/s تصطدم بحاجز صخري ثم تتوقف. إذا كان متوسط القوة المؤثرة عليها 5 × 10³ N فما الزمن اللازم لتوقفها؟", "o": ["1/6 s", "1/2 s", "2 s", "6 s"], "a": 3, "e": "الدفع = التغير في الزخم: F·t = m·Δv ← t = (1000 × 30) ÷ 5000 = 6 s"}, {"q": "تقع حلقات فتح الباب A و B و C و D على مسافات مختلفة من مفصلات الباب (محور الدوران)؛ الحلقة A هي الأقرب إلى المفصلات والحلقة D هي الأبعد. أي الحلقات يمكن استخدامها لتصبح قوة الجذب اللازمة لفتح الباب أقل ما يمكن؟", "o": ["D", "C", "B", "A"], "a": 0, "e": "العزم = القوة × ذراع القوة؛ كلما زادت المسافة عن محور الدوران قلّت القوة اللازمة لنفس العزم."}, {"q": "سفينة شحن حجمها 400 m³ تسير بسرعة 40 km/h باتجاه الجنوب الشرقي، حاملة 5 سيارات كتلة الواحدة 1500 kg، وتتعرض لقوة إعاقة من الهواء مقدارها 4 × 10⁴ N. أي الكميات الواردة في النص تُعدّ كمية متجهة؟", "o": ["قوة الإعاقة والسرعة", "السرعة والحجم", "قوة الإعاقة والكتلة", "الكتلة والحجم"], "a": 0, "e": "الكمية المتجهة لها مقدار واتجاه: السرعة (باتجاه الجنوب الشرقي) وقوة الإعاقة. أما الحجم والكتلة فكميتان قياسيتان."}, {"q": "آلة مركبة تتكون من آلتين بسيطتين: الفائدة الميكانيكية للأولى 10 وللثانية 2، const app = document.getElementById('app');
const el = (h)=>{ const t=document.createElement('template'); t.innerHTML=h.trim(); return t.content.firstChild; };
const esc = s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
let view = {name:'home'};

function home(){
  let tc=0, td=0; for(let s=0;s<NSEC;s++){const r=secScore(s); tc+=r.c; td+=r.d;}
  let h = `<div class="hdr"><div><h1>مراجعة اختبار البترول 2026</h1><p>300 سؤال في 12 قسمًا، كل قسم 25 سؤالًا، مع تصحيح فوري وشرح لكل إجابة</p></div>
  <div class="total"><b>${tc}</b> / 300<span>أجبتَ على ${td} سؤالًا</span></div></div>
  <div class="who"><label for="nm">اسم الطالب</label><input id="nm" type="text" placeholder="اكتب اسمك الثلاثي" value="${esc(st.name)}"></div>`;
  const groups = [[0,4,'أسئلة تجميع البترول','100 سؤال مأخوذة من ملف التجميع، مرتبة كما وردت'],[4,12,'تدريب موسّع','200 سؤال إضافية على الموضوعات نفسها']];
  groups.forEach(([a,b,t,sub])=>{
    h += `<div class="grp"><h2>${t}</h2><span>${sub}</span></div><div class="grid">`;
    for(let s=a;s<b;s++){
      const r=secScore(s), pct=Math.round(r.d/SEC*100), fin=r.d===SEC;
      h += `<button class="card ${fin?'done':''}" data-s="${s}"><span class="no">القسم ${s+1}</span><h3>${DATA.titles[s][0]}</h3><p>${DATA.titles[s][1]}</p>
      <div class="bar"><i style="width:${pct}%"></i></div><div class="meta"><span>${r.d} / ${SEC} مُجاب</span><span>${r.d?('الصحيح '+r.c):'لم يبدأ'}</span></div></button>`;
    }
    h += `</div>`;
  });
  h += `<button class="reset" id="rs">مسح كل النتائج والبدء من جديد</button>`;
  app.innerHTML = h;
  app.querySelectorAll('.card').forEach(b=>b.onclick=()=>{ const s=+b.dataset.s; const a=secAns(s); let i=a.findIndex(v=>v===null); if(i<0)i=0; view={name:'quiz',s,i}; render(); window.scrollTo(0,0); });
  const nm=document.getElementById('nm'); nm.oninput=()=>{st.name=nm.value; save();};
  const rs=document.getElementById('rs'); let armed=false;
  rs.onclick=()=>{ if(!armed){armed=true; rs.classList.add('arm'); rs.textContent='اضغط مرة أخرى للتأكيد: سيتم مسح كل شيء'; return;} st.ans={}; save(); render(); };
}

function quiz(){
  const {s,i}=view, a=secAns(s), q=qOf(s,i), ch=a[i], answered=ch!==null;
  let dots=''; for(let k=0;k<SEC;k++){ const v=a[k]; let c=''; if(v!==null) c = v===qOf(s,k).a?'ok':'no'; if(k===i) c+=' cur'; dots+=`<button class="dot ${c}" data-k="${k}" aria-label="السؤال ${k+1}">${k+1}</button>`; }
  const r=secScore(s);
  let opts=''; q.o.forEach((t,k)=>{ let c=''; if(answered){ if(k===q.a)c='right'; else if(k===ch)c='wrong'; } opts+=`<li><button class="opt ${c}" data-k="${k}" ${answered?'disabled':''}><span class="l">${LET[k]}</span><span class="t">${esc(t)}</span></button></li>`; });
  let fb=''; if(answered){ const ok=ch===q.a; fb=`<div class="fb ${ok?'g':'b'}"><b>${ok?'إجابة صحيحة':'إجابة خاطئة، الصحيح هو: '+LET[q.a]}</b><div>${esc(q.e)}</div></div>`; }
  const last=i===SEC-1, allDone=a.every(v=>v!==null);
  app.innerHTML = `<div class="top"><div class="toprow"><strong>القسم ${s+1}: ${DATA.titles[s][0]}</strong><button class="back" id="bk">القائمة</button></div>
   <div class="bar" style="margin-top:8px"><i style="width:${Math.round(a.filter(v=>v!==null).length/SEC*100)}%"></i></div><div class="dots">${dots}</div></div>
   <div class="q"><div class="qn">السؤال ${i+1} من ${SEC} &nbsp;·&nbsp; الصحيح حتى الآن ${r.c}</div><div class="qt">${esc(q.q)}</div><ul class="opts">${opts}</ul>${fb}</div>
   <div class="nav"><button class="btn alt" id="pv" ${i===0?'disabled':''}>السابق</button>
   ${last? `<button class="btn" id="fin" ${allDone?'':'disabled'}>عرض نتيجة القسم</button>` : `<button class="btn" id="nx">${answered?'التالي':'تخطي'}</button>`}</div>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ a[i]=+b.dataset.k; save(); render(); });
  app.querySelectorAll('.dot').forEach(b=>b.onclick=()=>{ view.i=+b.dataset.k; render(); });
  document.getElementById('bk').onclick=()=>{view={name:'home'}; render();};
  document.getElementById('pv').onclick=()=>{view.i--; render();};
  const nx=document.getElementById('nx'); if(nx) nx.onclick=()=>{view.i++; render();};
  const fin=document.getElementById('fin'); if(fin) fin.onclick=()=>{view={name:'result',s}; render(); window.scrollTo(0,0);};
}

function tier(p){
  if(p>=90) return ['ممتاز','مستواك ممتاز في هذا القسم. انتقل إلى القسم التالي وحافظ على هذا الأداء.'];
  if(p>=75) return ['جيد جدًا','أداء قوي. راجع الأسئلة التي أخطأت فيها أدناه لتصل إلى الدرجة الكاملة.'];
  if(p>=60) return ['جيد','أنت في الطريق الصحيح. أعد قراءة شرح الأسئلة الخاطئة ثم أعد المحاولة.'];
  return ['يحتاج إلى مراجعة','راجع قوانين هذا القسم ثم أعد المحاولة. ركّز على فهم الشرح قبل الحفظ.'];
}
function result(){
  const s=view.s, a=secAns(s), r=secScore(s), p=Math.round(r.c/SEC*100), t=tier(p);
  let rv=''; a.forEach((v,i)=>{ const q=qOf(s,i); if(v!==q.a){ rv+=`<div class="rvi"><div class="qn">السؤال ${i+1}</div><div class="qt">${esc(q.q)}</div>
    <p class="n">${v===null?'لم تُجب':'إجابتك: '+esc(q.o[v])}</p><p class="y">الصحيح: ${esc(q.o[q.a])}</p><p>${esc(q.e)}</p></div>`; } });
  app.innerHTML = `<div class="hdr"><div><h1>القسم ${s+1}: ${DATA.titles[s][0]}</h1><p>${st.name?esc(st.name):'نتيجة القسم'}</p></div></div>
   <div class="res"><div class="score">${r.c} / ${SEC}</div><h2>${t[0]} · ${p}%</h2><p>${t[1]}</p>
   <div class="acts"><button class="btn" id="rt">إعادة القسم</button>${s<NSEC-1?'<button class="btn alt" id="nxs">القسم التالي</button>':''}<button class="btn alt" id="hm">القائمة الرئيسية</button></div></div>
   <div class="rv">${rv?`<h3>الأسئلة التي تحتاج إلى مراجعة (${SEC-r.c})</h3>${rv}`:'<h3>أجبت عن جميع الأسئلة إجابة صحيحة.</h3>'}</div>`;
  document.getElementById('rt').onclick=()=>{ st.ans[s]=Array(SEC).fill(null); save(); view={name:'quiz',s,i:0}; render(); window.scrollTo(0,0); };
  const n=document.getElementById('nxs'); if(n) n.onclick=()=>{ view={name:'quiz',s:s+1,i:0}; render(); window.scrollTo(0,0); };
  document.getElementById('hm').onclick=()=>{view={name:'home'}; render();};
}
function render(){ ({home,quiz,result})[view.name](); }
render();
</script>

</body></html>
